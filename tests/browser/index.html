<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>網頁測試</title>
<style>
  :root { color-scheme: light; --ok: #1d7a46; --bad: #b42318; --muted: #667085; }
  body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, "Noto Sans TC", sans-serif; background: #fff; color: #101828; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #summary { margin: 0 0 12px; color: var(--muted); }
  #summary.ok { color: var(--ok); font-weight: 600; }
  #summary.bad { color: var(--bad); font-weight: 600; }
  ol { padding-left: 24px; margin: 0; }
  li { margin: 2px 0; }
  li.pass::marker { color: var(--ok); }
  li.fail { color: var(--bad); }
  li small { color: var(--muted); }
  pre { white-space: pre-wrap; margin: 2px 0 6px; font-size: 13px; }
  #stage { position: fixed; left: -10000px; top: 0; }
  #stage iframe { border: 0; display: block; }
</style>
</head>
<body>
<h1>網頁測試（任務 10）</h1>
<p id="summary">執行中…</p>
<ol id="results"></ol>
<div id="stage"></div>
<script type="module" src="run.js"></script>
</body>
</html>
