<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>攤商登入（手機版）</title>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B3B5B" flood-opacity="0.12"/></filter></defs>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#F6E3C7"/><g id="login-hero"><image href="../../assets/login-bg.png" x="-220" y="-24" width="768" height="512" preserveAspectRatio="xMidYMid slice"/><rect x="8" y="10" width="168" height="48" rx="24" fill="#fff" opacity="0.95"/><g transform="translate(24 23) scale(0.92)" fill="none" stroke="#E5484D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></g><text x="54" y="41" font-size="18" font-weight="900" fill="#4A2E1C" text-anchor="start" letter-spacing="2">攤商專區</text></g><g id="login-card" transform="translate(0 -62)" data-state="default"><rect x="16" y="216" width="358" height="660" rx="28" fill="#FDFCF9" filter="url(#shadow)"/><text x="195" y="268" font-size="34" font-weight="900" fill="#4A2E1C" text-anchor="middle" letter-spacing="3">攤商登入</text><text x="195" y="300" font-size="15" font-weight="500" fill="#5B4636" text-anchor="middle">請選擇縣市、攤商名稱並輸入密碼，</text><text x="195" y="324" font-size="15" font-weight="500" fill="#5B4636" text-anchor="middle">進入專屬頁面填寫 Google 地圖資料。</text><g data-field="county" data-state="default"><rect x="32" y="350" width="326" height="58" rx="29" fill="#fff" stroke="#E4DED4" stroke-width="1.5"/><g transform="translate(52 368) scale(0.92)" fill="none" stroke="#3F3A36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></g><text x="88" y="385" font-size="17" font-weight="500" fill="#8A8580" text-anchor="start">選擇縣市</text><g transform="translate(316 369) scale(0.83)" fill="none" stroke="#3F3A36" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></g></g><g data-field="merchant" data-state="default"><rect x="32" y="422" width="326" height="58" rx="29" fill="#fff" stroke="#E4DED4" stroke-width="1.5"/><g transform="translate(52 440) scale(0.92)" fill="none" stroke="#3F3A36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16"/><path d="M4 9c0 1.7 1.3 3 3 3s2.7-1.3 2.7-3c0 1.7 1.3 3 2.7 3s2.6-1.3 2.6-3c0 1.7 1.2 3 2.8 3S20 10.7 20 9"/><path d="M5 12v8h14v-8"/></g><text x="88" y="457" font-size="17" font-weight="500" fill="#8A8580" text-anchor="start">選擇攤商名稱</text><g transform="translate(316 441) scale(0.83)" fill="none" stroke="#3F3A36" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></g></g><g data-field="password" data-state="default"><rect x="32" y="494" width="326" height="58" rx="29" fill="#fff" stroke="#E4DED4" stroke-width="1.5"/><g transform="translate(52 512) scale(0.92)" fill="none" stroke="#3F3A36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></g><text x="88" y="529" font-size="17" font-weight="500" fill="#8A8580" text-anchor="start">請輸入密碼</text><g transform="translate(312 510) scale(1.08)" fill="none" stroke="#3F3A36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.6 9.6 0 0 1 12 6c5 0 8.5 4.5 9.5 6-.5.8-1.6 2.2-3.1 3.5"/><path d="M6.3 7.6C4.5 8.9 3.1 10.8 2.5 12c1 1.5 4.5 6 9.5 6 1.4 0 2.7-.3 3.9-.9"/><path d="M9.9 10a3 3 0 0 0 4.2 4.1"/></g></g><g id="login-submit" data-action="login"><rect x="32" y="574" width="326" height="62" rx="31" fill="#1F6FE5"/><g transform="translate(150 591) scale(1.08)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l4-4-4-4"/><path d="M14 12H4"/></g><text x="214" y="614" font-size="21" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="6">登入</text></g><line x1="32" y1="664" x2="358" y2="664" stroke="#ECE7DF" stroke-width="1.5"/><g id="login-help" data-action="forgot-password"><g transform="translate(54 688) scale(0.92)" fill="none" stroke="#8A8580" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><path d="M12 17h.01"/></g><text x="84" y="705" font-size="15" font-weight="700" fill="#1F6FE5" text-anchor="start">忘記密碼？請聯絡主辦單位協助重設</text></g><text x="195" y="760" font-size="14" font-weight="500" fill="#5B4636" text-anchor="middle">完成後就能在 Google 地圖被找到喔！</text></g>
</svg>
