<image href="../../assets/login-bg.png" x="0" y="0" width="1536" height="1024" preserveAspectRatio="xMidYMid slice"/><g id="login-card" data-state="error"><path d="M418 376H604V342H1118V940a40 40 0 0 1-40 40H458a40 40 0 0 1-40-40z" fill="#FDFCF9"/><text x="773" y="412" font-size="50" font-weight="900" fill="#4A2E1C" text-anchor="middle" letter-spacing="4">攤商登入</text><path d="M908 372l6-10M920 380l12-6M920 394l12 2" stroke="#F2B200" stroke-width="4" stroke-linecap="round"/><text x="768" y="450" font-size="21" font-weight="500" fill="#5B4636" text-anchor="middle">請選擇你的縣市、攤商名稱並輸入密碼，</text><text x="768" y="485" font-size="21" font-weight="500" fill="#5B4636" text-anchor="middle">進入專屬頁面填寫 Google 地圖資料。</text><g data-field="county" data-state="default"><rect x="471" y="517" width="594" height="70" rx="35" fill="#fff" stroke="#E4DED4" stroke-width="1.5"/><g transform="translate(503 539) scale(1.08)" fill="none" stroke="#3F3A36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></g><text x="556" y="559.5" font-size="21" font-weight="500" fill="#2B2118" text-anchor="start">台南市</text><g transform="translate(1011 540) scale(1)" fill="none" stroke="#3F3A36" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></g></g><g data-field="merchant" data-state="default"><rect x="471" y="603" width="594" height="70" rx="35" fill="#fff" stroke="#E4DED4" stroke-width="1.5"/><g transform="translate(503 625) scale(1.08)" fill="none" stroke="#3F3A36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9h16"/><path d="M4 9c0 1.7 1.3 3 3 3s2.7-1.3 2.7-3c0 1.7 1.3 3 2.7 3s2.6-1.3 2.6-3c0 1.7 1.2 3 2.8 3S20 10.7 20 9"/><path d="M5 12v8h14v-8"/></g><text x="556" y="645.5" font-size="21" font-weight="500" fill="#2B2118" text-anchor="start">香香超大烤雞排</text><g transform="translate(1011 626) scale(1)" fill="none" stroke="#3F3A36" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></g></g><g data-field="password" data-state="error"><rect x="471" y="690" width="594" height="70" rx="35" fill="#fff" stroke="#E5484D" stroke-width="2"/><g transform="translate(503 712) scale(1.08)" fill="none" stroke="#3F3A36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></g><text x="556" y="732.5" font-size="21" font-weight="500" fill="#3F3A36" text-anchor="start">••••••</text><g transform="translate(1001 710) scale(1.25)" fill="none" stroke="#3F3A36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.6 9.6 0 0 1 12 6c5 0 8.5 4.5 9.5 6-.5.8-1.6 2.2-3.1 3.5"/><path d="M6.3 7.6C4.5 8.9 3.1 10.8 2.5 12c1 1.5 4.5 6 9.5 6 1.4 0 2.7-.3 3.9-.9"/><path d="M9.9 10a3 3 0 0 0 4.2 4.1"/></g></g><g id="login-error" data-role="alert"><circle cx="492" cy="782" r="9" fill="#E5484D"/><text x="492" y="787" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">!</text><text x="510" y="788" font-size="15" font-weight="500" fill="#E5484D" text-anchor="start">密碼錯誤，請再試一次。連續錯誤 5 次將暫停登入 15 分鐘。</text></g><g id="login-submit" data-action="login"><rect x="471" y="810" width="594" height="76" rx="38" fill="#1F6FE5"/><g transform="translate(712 832) scale(1.33)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l4-4-4-4"/><path d="M14 12H4"/></g><text x="796" y="860" font-size="24" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="8">登入</text></g><line x1="471" y1="919" x2="1065" y2="919" stroke="#ECE7DF" stroke-width="1.5"/><g id="login-help" data-action="forgot-password"><g transform="translate(581 934) scale(1.08)" fill="none" stroke="#8A8580" strok